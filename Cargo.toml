[package]
name = "aerodynamicsWM"
version = "0.0.1"
edition = "2021"
authors = ["Confucius40 <yiff@paws.lol>"]
description = "Infinite canvas X11 window manager with pan/zoom and Scheme configuration"
repository = "https://github.com/confucius40/aerodynamicsWM"
homepage = "https://github.com/confucius40/aerodynamicsWM"
documentation = "https://docs.rs/aerodynamicsWM"
readme = "README.md"
keywords = ["x11", "wm", "window-manager", "canvas", "floating"]
categories = ["gui"]
license = "GPL-3.0-only"

[dependencies]
xcb = { version = "1.4", features = ["xfixes", "render", "randr"] }
xcb-util = "0.4.0"
x11 = { version = "2.21.0", features = ["xft", "xlib"] }
libc = "0.2"
dirs = "5.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
 
[dev-dependencies]
criterion = "0.5"
 
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

#[[bench]]
#name = "canvas_pan"
#harness = false
